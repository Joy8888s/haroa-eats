<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haroa Eats</title><style>
body{font-family:Arial;margin:0;background:#f6f6f6;color:#222}header{background:#e23744;color:white;padding:16px}.wrap{max-width:1050px;margin:auto;padding:0 15px}.brand{font-size:28px;font-weight:800}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:8px;padding:10px 14px;background:#e23744;color:#fff;font-weight:bold;cursor:pointer}button.dark{background:#222}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px}.hero{background:#fff;padding:28px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.card{background:#fff;padding:17px;border-radius:14px;margin:15px 0;box-shadow:0 2px 10px #0001}.item{display:flex;justify-content:space-between;border-top:1px solid #eee;padding:12px 0}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end}.modal.on{display:flex}.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px}.cart{position:fixed;right:15px;bottom:15px;border-radius:30px}.hidden{display:none}.notice{background:#fff8d8;padding:12px;border-radius:8px}.pill{background:#fff0f1;color:#c21f2b;padding:5px 8px;border-radius:20px;font-size:12px}
</style></head><body>
<header><div class="wrap"><div class="brand">🍴 Haroa Eats</div><div>Haroa-এর local food delivery</div><div class="nav"><button onclick="home()">Home</button><button onclick="orders()">My Orders</button><button onclick="loginBox()">Login</button><button onclick="logout()">Logout</button><button onclick="admin()">Admin</button></div></div></header>
<div id="homeView"><div class="hero"><div class="wrap"><h1>খাবার ঘরে বসেই</h1><input id="search" placeholder="Restaurant বা খাবার খুঁজুন..." oninput="render()"></div></div><main class="wrap"><h2>Restaurants</h2><div id="restaurants" class="grid"></div></main></div>
<main class="wrap"><section id="ordersView" class="hidden"><h2>My Orders</h2><div id="ordersList"></div></section><section id="adminView" class="hidden"><h2>Admin Dashboard</h2><div id="stats" class="grid"></div><div class="card"><h3>All Orders</h3><div id="adminOrders"></div></div></section></main>
<button class="cart" onclick="openCart()">🛒 Cart (<span id="cnt">0</span>)</button>
<div id="cartModal" class="modal"><div class="sheet"><button class="dark" onclick="closeCart()">Close</button><h2>Cart</h2><div id="cart"></div><h3>Total ₹<span id="total">0</span></h3><textarea id="address" placeholder="Delivery address"></textarea><button onclick="checkout()">Order Confirm</button><div id="checkoutMsg"></div></div></div>
<div id="loginModal" class="modal"><div class="sheet"><button class="dark" onclick="closeLogin()">Close</button><h2>Login / Register</h2><input id="name" placeholder="নাম (register-এর জন্য)"><input id="phone" placeholder="মোবাইল"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button> <button onclick="register()">Register</button><p id="loginMsg"></p><div class="notice">Demo admin: mobile <b>9999999999</b>, password <b>admin123</b>. Live করার আগে বদলাতে হবে।</div></div></div>
<script>
let data=[],cartItems=[];
async function api(u,o){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let x=await r.json();if(!r.ok)throw Error(x.error||'Error');return x}
async function render(){data=await api('/api/restaurants');let q=(search.value||'').toLowerCase();restaurants.innerHTML=data.filter(r=>(r.name+r.area+r.menu.map(x=>x.name).join('')).toLowerCase().includes(q)).map(r=>`<div class="card"><span class="pill">${r.area}</span><h3>${r.name}</h3>${r.menu.map(m=>`<div class="item"><span>${m.name}<br><b>₹${m.price}</b></span><button onclick="add(${r.id},${m.id},'${m.name.replace(/'/g,"&#39;")}',${m.price})">Add</button></div>`).join('')}</div>`).join('')}
function add(rid,mid,n,p){cartItems.push({restaurantId:rid,menuId:mid,name:n,price:p,qty:1});drawCart();alert(n+' cart-এ যোগ হয়েছে')}
function drawCart(){cnt.textContent=cartItems.reduce((s,x)=>s+x.qty,0);cart.innerHTML=cartItems.length?cartItems.map((x,i)=>`<div class="item"><span>${x.name} × ${x.qty}</span><span>₹${x.price*x.qty} <button class="dark" onclick="cartItems.splice(${i},1);drawCart()">×</button></span></div>`).join(''):'<p>Cart খালি।</p>';total.textContent=cartItems.reduce((s,x)=>s+x.price*x.qty,0)}
function openCart(){cartModal.classList.add('on');drawCart()}function closeCart(){cartModal.classList.remove('on')}
async function checkout(){if(!cartItems.length)return alert('Cart খালি');let me=await api('/api/me');if(!me.user)return loginBox();if(!address.value.trim())return alert('Address দিন');let rid=cartItems[0].restaurantId;if(cartItems.some(x=>x.restaurantId!==rid))return alert('একবারে একটি restaurant থেকে order করুন');let x=await api('/api/orders',{method:'POST',body:JSON.stringify({restaurantId:rid,address:address.value,items:cartItems.map(x=>({menuId:x.menuId,qty:x.qty}))})});checkoutMsg.innerHTML='<div class="notice">Order ID: <b>'+x.orderId+'</b><br>Order received successfully.</div>';cartItems=[];drawCart()}
function loginBox(){loginModal.classList.add('on')}function closeLogin(){loginModal.classList.remove('on')}
async function login(){try{let x=await api('/api/login',{method:'POST',body:JSON.stringify({phone:phone.value,password:pass.value})});loginMsg.textContent='Login successful: '+x.user.role;closeLogin()}catch(e){loginMsg.textContent=e.message}}
async function register(){
  try {
    const nameEl = document.getElementById('name');
    const phoneEl = document.getElementById('phone');
    const passEl = document.getElementById('pass');

    const x = await api('/api/register', {
      method: 'POST',
      body: JSON.stringify({
        name: nameEl.value.trim(),
        phone: phoneEl.value.trim(),
        password: passEl.value
      })
    });

    loginMsg.textContent = x.message || 'Registration successful';
    alert(x.message || 'Registration successful');

  } catch(e) {
    loginMsg.textContent = e.message;
    alert(e.message);
  }
}
function home(){homeView.classList.remove('hidden');ordersView.classList.add('hidden');adminView.classList.add('hidden');render()}
async function orders(){homeView.classList.add('hidden');adminView.classList.add('hidden');ordersView.classList.remove('hidden');try{let x=await api('/api/orders');ordersList.innerHTML=x.map(o=>`<div class="card"><b>Order #${o.id}</b> — ${o.status}<br>${o.restaurant}<br>${o.items.map(i=>i.name+' × '+i.qty).join(', ')}<br><b>₹${o.total}</b><br>${o.address}</div>`).join('')||'<p>No orders</p>'}catch(e){ordersList.innerHTML='<p>'+e.message+'</p>'}}
async function admin(){homeView.classList.add('hidden');ordersView.classList.add('hidden');adminView.classList.remove('hidden');try{let s=await api('/api/admin/stats');stats.innerHTML=Object.entries(s).map(([k,v])=>`<div class="card"><b>${k}</b><h2>${v}</h2></div>`).join('');let os=await api('/api/orders');adminOrders.innerHTML=os.map(o=>`<div class="item"><span>#${o.id} ${o.customer||''} — ₹${o.total}<br>${o.status}</span><button onclick="status(${o.id},'Preparing')">Preparing</button> <button onclick="status(${o.id},'Delivered')">Delivered</button></div>`).join('')}catch(e){adminOrders.innerHTML='<p>'+e.message+'</p>'}}
async function status(id,s){await api('/api/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:s})});admin()}
home();
</script></body></html>
